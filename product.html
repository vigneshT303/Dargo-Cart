<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DragoCart</title>
  <link rel="shortcut icon" href="./assets/my project logo.png" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    section {
      scroll-margin-top: 180px;
    }

    .navbar-dark.bg-dark {
      background-color: #8c5db3 !important;
    }

    .card {
      background-color: rgb(26, 189, 222);
      margin: 10px;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.01);
      box-shadow: 0 8px 20px black;
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 7px;
      transition: transform 0.3s ease;
      flex-wrap: wrap;
      display: flex;

    }

    .card img:hover {
      transform: scale(1.01);
    }

    .carousel-item img {
      width: 100%;
      height: 630px;
      object-fit: cover;
      transition: transform 0.1s ease;
      background-size: cover;
    }

    .carousel-item img:hover {
      transform: scale(1.01);
    }

    .nav-link {
      transition: color 0.3s ease, transform 0.3s ease;
      font-family: 'Times New Roman', Times, serif;
      font-weight: bold;
      height: 50px;
      width: 100px;
      text-align: justify;
    }

    .nav-link:hover {
      color: #7f207f;
      transform: scale(1.1);
    }

    #contact-section {
      background-color: rgb(174, 42, 150);
      object-fit: cover;
      padding: 40px;
      border-radius: 10px;
      color: white;
      text-align: left;
      transition: all 0.3s ease;
    }

    #contact-section .form-control {
      border-radius: 8px;
      border: none;
      padding: 10px;
    }

    #contact-section .btn-primary {
      background-color: rgb(165, 91, 169);/
    }

    #contact-section .btn-primary:hover {
      background-color: #8e44ad;
      transform: scale(1.05);

    }

    footer.bg-dark {
      height: 150px;
      background-color: #b24c89 !important;
      text-align: center;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Drago Cart</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul id="header" class="navbar-nav ms-auto"></ul>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="cart.html">🛒 Cart</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>


  <section>
    <div id="homeCarousel" class="carousel slide mt-4" data-bs-ride="carousel">
      <div class="carousel-indicators" id="carousel-indicators"></div>
      <div class="carousel-inner" id="carousel-inner"></div>
      <button class="carousel-control-prev" type="button" data-bs-target="#homeCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#homeCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </section>


  <section id="product">
    <div class="container-fluid mt-4" id="products-section">
      <h2 class="text-center">Products</h2>
      <div id="products" class="row"></div>
    </div>
  </section>


  <section>
    <div id="contact-section" class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <h1>
            <center>Contact Us</center>
            </h2>
            <form>
              <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
              </div>
              <div class="mb-3">
                <label for="text" class="form-label">Contact no:</label>
                <input type="text" class="form-control" id="number" placeholder="Contact" required>
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Message:</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Enter your message"
                  required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
      </div>
    </div>
  </section>

  <footer class="bg-dark text-white text-center py-3 mt-4" id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    fetch("product.json")
      .then(res => res.json())
      .then(siteData => {
        const headerUl = document.getElementById("header");
        siteData.header.forEach(item => {
          let li = document.createElement("li");
          li.classList.add("nav-item");

          let linkTarget = "#";
          if (item.toLowerCase() === "home") linkTarget = "#homeCarousel";
          if (item.toLowerCase() === "products") linkTarget = "#products-section";
          if (item.toLowerCase() === "contact") linkTarget = "#contact-section";

          li.innerHTML = `<a class="nav-link" href="${linkTarget}">${item}</a>`;
          headerUl.appendChild(li);
        });

        const indicators = document.getElementById("carousel-indicators");
        const inner = document.getElementById("carousel-inner");
        siteData.carousel.forEach((slide, index) => {
          let button = document.createElement("button");
          button.type = "button";
          button.setAttribute("data-bs-target", "#homeCarousel");
          button.setAttribute("data-bs-slide-to", index);
          if (index === 0) button.classList.add("active");
          indicators.appendChild(button);

          let div = document.createElement("div");
          div.classList.add("carousel-item");
          if (index === 0) div.classList.add("active");
          div.innerHTML = `
            <img src="${slide.image}" class="d-block w-100" alt="${slide.title}">
            <div class="carousel-caption d-none d-md-block">
              <h5>${slide.title}</h5>
              <p>${slide.desc}</p>
            </div>
          `;
          inner.appendChild(div);
        });

        const productsDiv = document.getElementById("products");
        siteData.products.forEach(p => {
          let col = document.createElement("div");
          col.classList.add("col-lg-3", "col-md-4", "col-sm-6");
          col.innerHTML = `
            <div class="card mb-4">
              <img src="${p.image}" class="card-img-top" alt="${p.name}">
              <div class="card-body">
                <h5 class="card-title">${p.name}</h5>
                <p class="card-text">Color: ${p.color}</p>
                <p class="card-text">Price: ₹${p.price}</p>
                <button class="btn btn-primary" onclick='addToCart(${JSON.stringify(p)})'>Add to Cart</button>
              </div>
            </div>
          `;
          productsDiv.appendChild(col);
        });

        document.getElementById("footer").innerText = siteData.footer;
      })
      .catch(err => console.error("Error loading data:", err));

    function addToCart(product) {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      const exists = cart.find((e) => e.id == product.id);

      if (exists) {
        exists.cartQty += 1;
        alert(`${product.name} quantity updated to ${exists.cartQty} in cart!`);
      } else {
        cart.push({ ...product, cartQty: 1 });
        alert(`${product.name} added to cart! 🛒`);
      }

      localStorage.setItem("cart", JSON.stringify(cart));
    }
  </script>
</body>

</html>
