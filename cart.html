<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cart</title>
  <style>
     body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: url("./assets/1.webp");
      background-repeat: no-repeat;
      background-size: cover;
      
    
    }
    h1{
        font-family: 'Times New Roman', Times, serif;
        font-weight: bold;
        font-style: italic;
        color:white;
    }
    #cart {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .cart-card {
      border: 5px solid black;
      border-radius: 40px;
      padding: 10px;
      width: 300px;
      box-shadow: 0 5px 6px black;
      text-align: center;
      background-color:lightcoral;
      transition: transform 0.2s ease;
    }
    .cart-card:hover {
      transform: scale(1.05);
    }
    .cart-card img {
      border-radius: 100px;
      margin-bottom: 10px;
    
    }
    .cart-card h5 {
      margin: 10px 0;
      font-size: 20px;
    }
    .cart-card p {
      margin: 5px 0;
      font-size: 15px;
      font-weight: bold;
    }
    .cart-card button {
      margin: 5px;
      padding: 5px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background-color: brown;
      color: white;
    }
    .cart-card button:hover {
      background-color: red;
    }
    #total {
      margin-top: 20px;
      font-size: 22px;
      color:whitesmoke;
    }
    button.place-btn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button.place-btn:hover {
      background-color: #1e7e34;
    }
  </style>
</head>
<body>
  <h1>My Cart</h1>
  <div id="cart"></div>
  <h1 id="total"></h1>
  <button class="place-btn" onclick="placemyorder()">Place Order</button>
</body>
<script>
  let container=document.getElementById("cart")

  let cartItem=JSON.parse(localStorage.getItem("cart"))
  let carttotal=0
  cartItem.map((c)=>{
      carttotal+=c.price*c.cartQty
      let card=document.createElement("div")
      card.classList.add("cart-card")
      card.innerHTML=`
       <img src="${c.image}"  alt="${c.name}" height=200 width=200>
      <h5 class="card-title">${c.name}</h5>
      <p class="card-text">Color: ${c.color}</p>
      <p class="card-text">Price: ₹${c.price}</p>
      <button onclick='decQty(${c.id})'>-</button>
      <span>${c.cartQty}</span>
      <button onclick='incQty(${c.id})'>+</button>
      <p>SubTotal: ₹${c.cartQty*c.price}</p>
      <button onclick='removeele(${c.id})'>Remove</button>
      `
      container.append(card)

      document.getElementById("total").innerText=`Total Amount: ₹${carttotal}`
  })

  function incQty(id){
      let cart=JSON.parse(localStorage.getItem("cart"))||[];
      let exists=cart.find(c=>c.id==id)
      if(exists){
          exists.cartQty++
      }
      localStorage.setItem("cart",JSON.stringify(cart))
      location.reload()
  }

  function decQty(id){
      let cart=JSON.parse(localStorage.getItem("cart"))||[];
      let exists=cart.find(c=>c.id==id)
      if(exists){
         if(exists.cartQty>1){
          exists.cartQty--
         }
      }
      localStorage.setItem("cart",JSON.stringify(cart))
      location.reload()
  }

  function removeele(id){
       let cart=JSON.parse(localStorage.getItem("cart"))||[];
      let elements=cart.filter(c=>c.id!=id)
      localStorage.setItem("cart",JSON.stringify(elements))
      location.reload()
  }

  function placemyorder(){
      let cart=JSON.parse(localStorage.getItem("cart"))
      localStorage.setItem("orders",JSON.stringify(cart))
      setTimeout(() => {
          window.location.href="orders.html"
      }, 1000);
  }
</script>
</html>
