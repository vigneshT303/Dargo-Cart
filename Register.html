<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="shortcut icon" href="./assets/mylogo.png" type="image/x-icon">
    <style>
        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family: Arial, sans-serif;
            background: url('./assets/project.jpg')
             no-repeat center center fixed;
            background-size: cover;
            display: flex;
            text-wrap: wrap;
        }

        .register-box{
            width:350px;
            padding:25px;
            background:lightpink;
            border-radius:12px;
            box-shadow: 0 10px 25px black;
            text-align:center;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        h1{
            margin-bottom:20px;
            color:rgb(164, 10, 191);
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid ;
            border-radius:6px;
            box-shadow: inset 2px 2px 5px black;
        }

        button{
            width:100%;
            padding:12px;
            background: purple;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            box-shadow: 0 5px 0 #4b004b;
            transition: all 0.2s ease;
        }

        button:hover{
            background:#a020f0;
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #4b004b;
        }

        button:active{
            transform: translateY(2px);
            box-shadow: 0 3px 0 #4b004b;
        }

        #msg{
            margin-right:15px;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <h1>Register Form</h1>
        <form action="" id="myform">
            <input type="text" placeholder="Enter name" id="name" required><br>
            <input type="email" placeholder="Enter email" id="email" required><br>
            <input type="password" placeholder="Enter password" id="pwd" required><br>
            <button>Submit</button>
        </form>
        <h2 id="msg"></h2>
    </div>

    <script>
        let regform=document.getElementById("myform")

        regform.onsubmit=function(e){
            e.preventDefault()
            let user={
                name:document.getElementById("name").value,
                email:document.getElementById("email").value,
                pwd:document.getElementById("pwd").value
            }

            localStorage.setItem("user",JSON.stringify(user))
            document.getElementById("msg").innerText="Register Success"
            document.getElementById("msg").style.color="green"
            setTimeout(() => {
                window.location.href="login.html"
            }, 1500);
        }
    </script>
</body>
</html>
