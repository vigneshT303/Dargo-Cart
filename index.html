<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drago Cart</title>
    <link rel="shortcut icon" href="./assets/my project logo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* -- Global Reset & Premium Dark Theme -- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-dark: #07030d;
            --bg-gradient: radial-gradient(circle at top left, #1c0836, #07030d);
            --primary: #ff00ff; /* Vivid Magenta highlight */
            --primary-glow: rgba(255, 0, 255, 0.5); /* Magenta glow */
            --secondary: #f4c2ff; /* Soft twilight pink */
            --glass-bg: rgba(25, 10, 40, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8f9fa;
            --text-muted: #adb5bd;
        }

        body {
            font-family: "Inter", Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(11, 4, 30, 0.5), rgba(28, 8, 54, 0.6)), url('./assets/purple-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* -- Page Transitions -- */
        .page:not(.active) {
            display: none !important;
        }

        .page.active {
            display: block;
            animation: luxuriousFade 0.6s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }

        @keyframes luxuriousFade {
            0% {
                opacity: 0;
                transform: scale(0.98) translateY(20px);
                filter: blur(4px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        /* -- Generic Glass Containers (Forms) -- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        /* Typography Enhancements */
        h1,
        h2,
        h3,
        h4,
        h5 {
            font-family: "Inter", sans-serif;
            font-weight: 800;
            color: var(--secondary);
            letter-spacing: -0.5px;
        }

        /* -- Generic Inputs -- */
        input,
        textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 12px !important;
            color: var(--text-main) !important;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus,
        textarea:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.4) !important;
            border-color: var(--primary) !important;
            box-shadow: 0 0 15px var(--primary-glow) !important;
        }

        /* -- Generic Buttons -- */
        button,
        .btn {
            background: linear-gradient(135deg, #700b97, #c100e6) !important;
            border: none !important;
            color: white !important;
            padding: 12px 28px;
            font-weight: 700;
            border-radius: 12px !important;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 1, 0.3, 1) !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(193, 0, 230, 0.4);
        }

        button:hover,
        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px rgba(193, 0, 230, 0.6), 0 0 15px var(--primary-glow);
        }

        button:active,
        .btn:active {
            transform: translateY(1px);
        }

        /* -- Registers & Logins -- */
        #page-register,
        #page-login {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-box,
        .login-box {
            width: 420px;
            max-width: 95%;
            padding: 48px 44px;
            text-align: center;
            background: rgba(20, 5, 45, 0.62) !important;
            border: 1px solid rgba(157, 78, 221, 0.4) !important;
            border-radius: 24px !important;
            box-shadow: 0 0 50px rgba(112, 11, 151, 0.45), 0 20px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
        }

        .register-box::before,
        .login-box::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, #7b2cbf, #ff00ff, #c100e6, #7b2cbf);
            background-size: 300% 100%;
            animation: animateBorder 3s linear infinite;
        }

        .register-box h1,
        .login-box h1 {
            font-size: 2.1rem;
            margin-bottom: 32px;
            background: linear-gradient(135deg, #e0aaff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            filter: drop-shadow(0 0 14px rgba(193,0,230,0.6));
        }

        .switch-link {
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .switch-link a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .switch-link a:hover {
            color: #fff;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        /* -- Header -- */
        .custom-header {
            background: rgba(10, 3, 20, 0.8) !important;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 1050;
            padding: 15px 0;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.5);
        }

        .navbar-brand {
            font-size: 1.8rem;
            font-weight: 900;
            background: -webkit-linear-gradient(45deg, #e0aaff, #9d4edd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }

        .nav-link:hover {
            color: #fff !important;
            text-shadow: 0 0 12px var(--primary-glow);
            transform: translateY(-2px);
        }

        /* -- Carousel -- */
        .carousel-item img {
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        /* -- Products Grid -- */
        #prod-section {
            padding: 40px 0;
        }

        .card {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border) !important;
            border-radius: 20px !important;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) !important;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 45px rgba(112,11,151,0.4), 0 0 30px rgba(193,0,230,0.22) !important;
            border-color: rgba(193, 0, 230, 0.65) !important;
            border-top: 2px solid #c100e6 !important;
        }

        .card-img-top {
            height: 260px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-title {
            color: #fff;
            font-size: 1.25rem;
        }

        .card-body p {
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        /* -- Cart & Orders shared UI -- */
        #cart,
        #orders {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin: 40px 0;
        }

        .cart-card,
        .order-card {
            width: 285px;
            padding: 22px;
            background: linear-gradient(160deg, rgba(30,8,60,0.72), rgba(18,4,38,0.82));
            border: 1px solid rgba(157, 78, 221, 0.45);
            border-top: 3px solid #9d4edd;
            border-radius: 24px;
            text-align: center;
            transition: all 0.35s cubic-bezier(0.2,1,0.3,1);
            box-shadow: 0 8px 32px rgba(112,11,151,0.22), 0 2px 12px rgba(0,0,0,0.4);
            backdrop-filter: blur(14px);
        }

        .cart-card:hover,
        .order-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(193,0,230,0.7);
            box-shadow: 0 20px 50px rgba(112,11,151,0.45), 0 0 25px rgba(193,0,230,0.25), inset 0 0 0 1px rgba(255,255,255,0.08);
        }

        .cart-card img,
        .order-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 15px;
        }

        .cart-card h5,
        .order-card h5 {
            color: #fff;
            margin-bottom: 5px;
        }

        .cart-card span {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0 15px;
            color: #fff;
        }

        .cart-card button {
            padding: 8px 16px;
            font-size: 1.2rem;
            min-width: 45px;
        }

        #cart h1,
        #orders h1 {
            text-align: center;
            margin-top: 30px;
            color: #e0aaff;
            text-shadow: 0 0 15px rgba(157, 78, 221, 0.5);
        }

        #total {
            text-align: center;
            font-size: 2rem;
            color: #fff;
            margin: 30px 0;
        }

        .place-btn,
        .back-btn {
            display: block;
            margin: 20px auto;
            width: 250px;
            text-align: center;
        }

        /* -- Order Form -- */
        .form-section,
        .contact-wrapper {
            background: linear-gradient(160deg, rgba(28,6,55,0.70), rgba(16,3,36,0.82));
            border: 1px solid rgba(157,78,221,0.38);
            border-radius: 25px;
            padding: 40px;
            max-width: 600px;
            margin: 40px auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .form-section::before,
        .contact-wrapper::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #7b2cbf, #ff00ff, #7b2cbf);
            background-size: 200% 100%;
            animation: animateBorder 3s linear infinite;
        }

        @keyframes animateBorder {
            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: -100% 0;
            }
        }

        .form-section label,
        .contact-wrapper label {
            color: var(--secondary);
            margin-bottom: 8px;
            font-weight: 600;
            display: block;
        }

        .form-section h2 {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #e0aaff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(193,0,230,0.5));
        }

        /* -- Contact Section -- */
        .contact-wrapper {
            max-width: 700px;
            padding: 50px;
            box-shadow: 0 0 50px rgba(112, 11, 151, 0.35), 0 20px 60px rgba(0,0,0,0.5);
        }

        .contact-wrapper h1 {
            background: linear-gradient(135deg, #e0aaff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(193,0,230,0.5));
            margin-bottom: 32px;
        }

        /* -- Footer -- */
        .custom-footer {
            background: #05010a;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 30px 0;
            margin-top: 60px;
        }

        /* -- Toast Notifications -- */
        #toast {
            position: fixed;
            bottom: 40px;
            right: 40px;
            padding: 20px 30px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            color: white;
            opacity: 0;
            transform: translateY(30px) scale(0.9);
            transition: all 0.5s cubic-bezier(0.2, 1.5, 0.3, 1);
            z-index: 9999;
            pointer-events: none;
            max-width: 450px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #toast.success {
            background: rgba(46, 204, 113, 0.85);
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.4);
        }

        #toast.error {
            background: rgba(231, 76, 60, 0.85);
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.4);
        }

        #toast.sending {
            background: rgba(157, 78, 221, 0.85);
            box-shadow: 0 10px 30px rgba(157, 78, 221, 0.4);
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s bezier infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Helpers */
        .msg-success {
            color: #2ecc71;
            margin-top: 15px;
        }

        .msg-error {
            color: #e74c3c;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <!-- ═══════════════════════════════════════════════════
       PAGE 1 – REGISTER
  ═══════════════════════════════════════════════════ -->
    <div id="page-register" class="page active">
        <div class="register-box glass-panel">
            <h1>Register Form</h1>
            <form id="registerForm">
                <input type="text" id="reg-name" placeholder="Enter name" required>
                <input type="email" id="reg-email" placeholder="Enter email" required>
                <input type="password" id="reg-pwd" placeholder="Enter password" required>
                <button type="submit">Submit</button>
            </form>
            <h2 id="reg-msg"></h2>
            <p class="switch-link">Already have an account? <a href="#"
                    onclick="showPage('page-login'); return false;">Login here</a></p>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════
       PAGE 2 – LOGIN
  ═══════════════════════════════════════════════════ -->
    <div id="page-login" class="page">
        <div class="login-box glass-panel">
            <h1>Login Form</h1>
            <form id="loginForm">
                <div class="input-box">
                    <label for="login-name">Username:</label>
                    <input type="text" id="login-name" placeholder="Enter name" required>
                </div>
                <div class="input-box">
                    <label for="login-pwd">Password:</label>
                    <input type="password" id="login-pwd" placeholder="Enter password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <h2 id="login-msg"></h2>
            <p class="switch-link">New here? <a href="#" onclick="showPage('page-register'); return false;">Register
                    now</a></p>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════
       PAGE 3 – PRODUCTS
  ═══════════════════════════════════════════════════ -->
    <div id="page-product" class="page">
        <nav class="navbar navbar-expand-lg navbar-dark custom-header">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Drago Cart</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul id="header" class="navbar-nav ms-auto"></ul>
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="navigateToCart(); return false;">🛒 Cart</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-warning" href="#" onclick="logOut(); return false;">🚪 Logout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Carousel -->
        <section>
            <div id="homeCarousel" class="carousel slide mt-4" data-bs-ride="carousel">
                <div class="carousel-indicators" id="carousel-indicators"></div>
                <div class="carousel-inner" id="carousel-inner"></div>
                <button class="carousel-control-prev" type="button" data-bs-target="#homeCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#homeCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </section>

        <!-- Products -->
        <section id="prod-section">
            <div class="container-fluid mt-4" id="products-section">
                <h2 class="text-center">Products</h2>
                <div id="products" class="row"></div>
            </div>
        </section>

        <!-- Contact -->
        <section>
            <div id="contact-section" class="container mt-4">
                <div class="row justify-content-center">
                    <div class="col-md-10 col-lg-8">
                        <div class="contact-wrapper">
                            <h1>Contact Us</h1>
                            <form id="contactFormAjax">
                                <div class="mb-3">
                                    <label class="form-label">Name:</label>
                                    <input type="text" id="contactName" class="form-control"
                                        placeholder="Enter your name" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email:</label>
                                    <input type="email" id="contactEmail" class="form-control"
                                        placeholder="Enter your email" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Contact no:</label>
                                    <input type="text" id="contactPhone" class="form-control"
                                        placeholder="Contact number" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Message:</label>
                                    <textarea id="contactMessage" class="form-control" rows="4"
                                        placeholder="Enter your message" required></textarea>
                                </div>
                                <button type="submit" id="contactSubmitBtn" class="btn btn-primary">Send
                                    Message</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer class="custom-footer text-center mt-4" id="footer"></footer>
    </div>

    <!-- ═══════════════════════════════════════════════════
       PAGE 4 – CART
  ═══════════════════════════════════════════════════ -->
    <div id="page-cart" class="page" style="min-height:100vh;padding:30px 20px;background:radial-gradient(ellipse at top,rgba(112,11,151,0.13),transparent 70%);">
        <button class="back-btn" onclick="showPage('page-product')">← Back to Products</button>
        <h1>My Cart</h1>
        <div id="cart"></div>
        <h1 id="total"></h1>
        <button class="place-btn" onclick="placeMyOrder()">Place Order</button>
    </div>

    <!-- ═══════════════════════════════════════════════════
       PAGE 5 – ORDERS
  ═══════════════════════════════════════════════════ -->
    <div id="page-orders" class="page" style="min-height:100vh;padding:30px 20px;background:radial-gradient(ellipse at top,rgba(112,11,151,0.13),transparent 70%);">
        <button class="back-btn" onclick="showPage('page-cart')">← Back to Cart</button>
        <h1>🛒 My Orders</h1>
        <div id="orders"></div>

        <div class="form-section">
            <h2>📋 Order Details</h2>
            <form id="orderForm">
                <label for="custName">Full Name:</label>
                <input type="text" id="custName" placeholder="Your full name" required>

                <label for="orderId">Order ID:</label>
                <input type="text" id="orderId" placeholder="e.g. ORD-2024-001" required>

                <label for="contact">Contact No:</label>
                <input type="tel" id="contact" placeholder="+91 XXXXX XXXXX" required>

                <label for="custMessage">Message (optional):</label>
                <textarea id="custMessage" rows="3" placeholder="Any special instructions…"></textarea>

                <button type="submit" class="place-order-btn" id="submitBtn">✅ Place Order</button>
            </form>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        /* ══════════════════════════════════════
           PAGE ROUTER (Hash-Based routing for Local Run)
        ══════════════════════════════════════ */
        function showPage(pageId, pushToHistory = true) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // Show target page
            document.getElementById(pageId).classList.add('active');

            // Trigger necessary data loads
            if (pageId === 'page-product') loadProducts();
            if (pageId === 'page-cart') renderCart();
            if (pageId === 'page-orders') renderOrders();

            // Update Browser URL securely for HTML local file
            if (pushToHistory) {
                const hash = '#' + pageId.replace('page-', '');
                window.history.pushState({ pageId }, '', hash);
            }
        }

        // Handle Browser Forward / Back buttons
        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.pageId) {
                showPage(e.state.pageId, false);
            } else {
                initRoute();
            }
        });

        // Initialize App Route from current Hash
        function initRoute() {
            let hash = window.location.hash.substring(1); // removes leading '#'

            // Handle internal product page anchors smoothly
            if (['homeCarousel', 'products-section', 'contact-section'].includes(hash)) {
                if (document.getElementById('page-product').classList.contains('active')) {
                    return; // Already on product page, just scroll natively
                }
                hash = 'product'; // Initial load, force product page
            }

            let targetPage = 'page-register'; // default fallback

            // Map clean URLs back to div IDs
            if (['login', 'product', 'cart', 'orders', 'register'].includes(hash)) {
                targetPage = 'page-' + hash;
            }

            showPage(targetPage, false);
        }

        // Run router on load
        window.addEventListener('DOMContentLoaded', initRoute);

        function logOut() {
            showPage('page-login');
        }

        function navigateToCart() {
            showPage('page-cart');
        }

        /* ══════════════════════════════════════
           REGISTER
        ══════════════════════════════════════ */
        document.getElementById('registerForm').onsubmit = function (e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerHTML = '<span class="spinner"></span>Registering...';
            btn.disabled = true;

            const user = {
                name: document.getElementById('reg-name').value,
                email: document.getElementById('reg-email').value,
                pwd: document.getElementById('reg-pwd').value
            };
            localStorage.setItem('user', JSON.stringify(user));
            const msg = document.getElementById('reg-msg');
            msg.textContent = 'Register Success';
            msg.className = 'msg-success';

            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                showPage('page-login');
            }, 1500);
        };

        /* ══════════════════════════════════════
           LOGIN
        ══════════════════════════════════════ */
        document.getElementById('loginForm').onsubmit = function (e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerHTML = '<span class="spinner"></span>Logging in...';
            btn.disabled = true;

            const name = document.getElementById('login-name').value;
            const password = document.getElementById('login-pwd').value;
            const stored = JSON.parse(localStorage.getItem('user'));
            const msg = document.getElementById('login-msg');

            if (stored && name === stored.name && password === stored.pwd) {
                msg.textContent = 'Login Success';
                msg.className = 'msg-success';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    showPage('page-product');
                }, 1500);
            } else {
                msg.textContent = 'INVALID USER';
                msg.className = 'msg-error';
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };

        /* ══════════════════════════════════════
           PRODUCTS
        ══════════════════════════════════════ */
        let productsLoaded = false;

        function loadProducts() {
            if (productsLoaded) return;

            // Embedded site data (avoids CORS issues on file:/// protocol)
            const siteData = {
                "header": ["Home", "Products", "Contact"],
                "carousel": [
                    { "image": "./assets/home1.avif", "title": "First Slide", "desc": "Some description for the first slide." },
                    { "image": "./assets/side2.webp", "title": "Second Slide", "desc": "Some description for the second slide." },
                    { "image": "./assets/side3.webp", "title": "Third Slide", "desc": "Some description for the third slide." }
                ],
                "products": [
                    { "id": 1, "name": "Samsung Galaxy A24", "price": 82000, "color": "Black", "image": "./assets/product1.jpeg" },
                    { "id": 2, "name": "Fastrack Watch", "price": 2500, "color": "Green", "image": "./assets/product2.jpeg" },
                    { "id": 3, "name": "RGB Mouse", "price": 1500, "color": "Gray", "image": "./assets/product3.jpeg" },
                    { "id": 4, "name": "Smart watch Ultra", "price": 3000, "color": "Red", "image": "./assets/product4.jpeg" },
                    { "id": 5, "name": "Iphone 15", "price": 65000, "color": "light blue", "image": "./assets/product5.jpeg" },
                    { "id": 6, "name": "Joy stick", "price": 2000, "color": "Black", "image": "./assets/product6.jpeg" },
                    { "id": 7, "name": "Iphone 17 Promax", "price": 120000, "color": "Orange", "image": "./assets/product7.jpeg" },
                    { "id": 8, "name": "Sandisk Pendrive", "price": 1500, "color": "Red", "image": "./assets/product8.jpeg" },
                    { "id": 9, "name": "Rolex Watch", "price": 6000, "color": "Glod", "image": "./assets/product9.jpeg" },
                    { "id": 10, "name": "Gaming Laptop", "price": 85000, "color": "Black", "image": "./assets/p1.webp" }
                ],
                "contact": {
                    "email": "support@myshop.com",
                    "phone": "+91 9876543210",
                    "address": "Tiruchirappalli, Tamil Nadu, India"
                },
                "footer": "© 2026 vignesh — All Rights Reserved"
            };

            productsLoaded = true;

            /* Header nav */
            const headerUl = document.getElementById('header');
            siteData.header.forEach(item => {
                let li = document.createElement('li');
                li.classList.add('nav-item');
                let linkTarget = '#';
                if (item.toLowerCase() === 'home') linkTarget = '#homeCarousel';
                if (item.toLowerCase() === 'products') linkTarget = '#products-section';
                if (item.toLowerCase() === 'contact') linkTarget = '#contact-section';
                li.innerHTML = `<a class="nav-link" href="${linkTarget}">${item}</a>`;
                headerUl.appendChild(li);
            });

            /* Carousel */
            const indicators = document.getElementById('carousel-indicators');
            const inner = document.getElementById('carousel-inner');
            siteData.carousel.forEach((slide, index) => {
                let btn = document.createElement('button');
                btn.type = 'button';
                btn.setAttribute('data-bs-target', '#homeCarousel');
                btn.setAttribute('data-bs-slide-to', index);
                if (index === 0) btn.classList.add('active');
                indicators.appendChild(btn);

                let div = document.createElement('div');
                div.classList.add('carousel-item');
                if (index === 0) div.classList.add('active');
                div.innerHTML = `
      <img src="${slide.image}" class="d-block w-100" alt="${slide.title}">
      <div class="carousel-caption d-none d-md-block">
        <h5>${slide.title}</h5>
        <p>${slide.desc}</p>
      </div>`;
                inner.appendChild(div);
            });

            /* Product cards */
            const productsDiv = document.getElementById('products');
            siteData.products.forEach(p => {
                let col = document.createElement('div');
                col.classList.add('col-lg-3', 'col-md-4', 'col-sm-6');
                col.innerHTML = `
      <div class="card mb-4">
        <img src="${p.image}" class="card-img-top" alt="${p.name}">
        <div class="card-body">
          <h5 class="card-title">${p.name}</h5>
          <p class="card-text">Color: ${p.color}</p>
          <p class="card-text">Price: ₹${p.price}</p>
          <button class="btn btn-primary" onclick='addToCart(${JSON.stringify(p)})'>Add to Cart</button>
        </div>
      </div>`;
                productsDiv.appendChild(col);
            });

            document.getElementById('footer').innerText = siteData.footer;
        }

        function addToCart(product) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const exists = cart.find(e => e.id == product.id);
            if (exists) {
                exists.cartQty += 1;
                alert(`${product.name} quantity updated to ${exists.cartQty} in cart!`);
            } else {
                cart.push({ ...product, cartQty: 1 });
                alert(`${product.name} added to cart! 🛒`);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        /* ══════════════════════════════════════
           CART
        ══════════════════════════════════════ */
        function renderCart() {
            const container = document.getElementById('cart');
            container.innerHTML = '';
            document.getElementById('total').innerText = '';

            const cartItems = JSON.parse(localStorage.getItem('cart')) || [];

            if (cartItems.length === 0) {
                container.innerHTML = "<p style='color:white;font-size:18px;'>Your cart is empty!</p>";
                return;
            }

            let carttotal = 0;
            cartItems.forEach(c => {
                carttotal += c.price * c.cartQty;
                let card = document.createElement('div');
                card.classList.add('cart-card');
                card.innerHTML = `
          <img src="${c.image}" alt="${c.name}" height="200" width="200">
          <h5 class="card-title">${c.name}</h5>
          <p class="card-text">Color: ${c.color}</p>
          <p class="card-text">Price: ₹${c.price}</p>
          <button onclick="decQty(${c.id})">-</button>
          <span>${c.cartQty}</span>
          <button onclick="incQty(${c.id})">+</button>
          <p>SubTotal: ₹${c.cartQty * c.price}</p>
          <button onclick="removeEle(${c.id})">Remove</button>`;
                container.appendChild(card);
            });

            document.getElementById('total').innerText = `Total Amount: ₹${carttotal}`;
        }

        function incQty(id) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let item = cart.find(c => c.id == id);
            if (item) item.cartQty++;
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function decQty(id) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let item = cart.find(c => c.id == id);
            if (item && item.cartQty > 1) item.cartQty--;
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function removeEle(id) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            localStorage.setItem('cart', JSON.stringify(cart.filter(c => c.id != id)));
            renderCart();
        }

        function placeMyOrder() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (!cart.length) { alert('Cart is empty!'); return; }
            localStorage.setItem('orders', JSON.stringify(cart));
            showPage('page-orders');
        }

        /* ══════════════════════════════════════
           ORDERS
        ══════════════════════════════════════ */
        function renderOrders() {
            const container = document.getElementById('orders');
            container.innerHTML = '';

            const ordersList = JSON.parse(localStorage.getItem('orders')) || [];

            if (ordersList.length === 0) {
                container.innerHTML = "<p style='text-align:center;color:#fff;font-size:18px;background:rgba(0,0,0,0.4);padding:12px 24px;border-radius:8px;'>No orders found!</p>";
            } else {
                ordersList.forEach(o => {
                    const card = document.createElement('div');
                    card.classList.add('order-card');
                    card.innerHTML = `
            <img src="${o.image}" alt="${o.name}" height="200" width="200">
            <h5>${o.name}</h5>
            <p>Color: ${o.color}</p>
            <p>Price: Rs.${o.price}</p>
            <p>Quantity: ${o.cartQty}</p>
            <p>SubTotal: Rs.${o.cartQty * o.price}</p>`;
                    container.appendChild(card);
                });
            }
        }

        /* Toast */
        let toastTimer;
        function showToast(msg, type = 'success', duration = 5000) {
            const toast = document.getElementById('toast');
            toast.innerHTML = msg;
            toast.className = 'show ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.className = ''; }, duration);
        }

        function buildProductText() {
            const ordersList = JSON.parse(localStorage.getItem('orders')) || [];
            if (!ordersList.length) return 'No products.';
            let grand = 0;
            const lines = ordersList.map(o => {
                const sub = o.cartQty * o.price;
                grand += sub;
                return `- ${o.name} | Color: ${o.color} | Price: Rs.${o.price} | Qty: ${o.cartQty} | Subtotal: Rs.${sub}`;
            });
            lines.push(`\nGRAND TOTAL: Rs.${grand}`);
            return lines.join('\n');
        }

        document.getElementById('orderForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const ordersList = JSON.parse(localStorage.getItem('orders')) || [];
            const customerName = document.getElementById('custName').value.trim();
            const orderId = document.getElementById('orderId').value.trim();
            const contact = document.getElementById('contact').value.trim();
            const custMessage = document.getElementById('custMessage').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const orderDate = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });

            // Validate required fields before submitting
            if (!customerName || !orderId || !contact) {
                showToast('Please fill in Name, Order ID, and Contact No.', 'error', 5000);
                return;
            }
            if (!ordersList.length) {
                showToast('No products in order. Go back and add items to cart.', 'error', 5000);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Processing...';
            showToast('Placing your order and saving to database...', 'sending', 20000);

            // Map local ordersList to match backend product schema
            const productsPayload = ordersList.map(item => ({
                productId: item.id,
                name: item.name,
                color: item.color,
                price: item.price,
                image: item.image,
                cartQty: item.cartQty
            }));

            // Correct payload sent to /api/orders
            const payload = {
                customerName,
                orderId,
                contact,
                message: custMessage,
                orderDate,
                products: productsPayload
            };

            try {
                const backendUrl = window.location.protocol === 'file:'
                    ? 'http://localhost:3000/api/orders'
                    : (window.location.port && window.location.port !== '3000'
                        ? `http://${window.location.hostname}:3000/api/orders`
                        : '/api/orders');

                const res = await fetch(backendUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    showToast('✅ Order placed successfully! Saved to DB.', 'success', 6000);
                    localStorage.removeItem('cart');
                    localStorage.removeItem('orders');
                    document.getElementById('orderForm').reset();
                    setTimeout(() => showPage('page-product'), 3500);
                } else {
                    throw new Error(data.error || `Status ${res.status} - Server rejected order.`);
                }
            } catch (err) {
                console.error('Order error:', err.message);
                showToast('Failed to place order: ' + err.message, 'error', 15000);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '✅ Place Order';
            }
        });

        /* ══════════════════════════════════════
           CONTACT FORM WEB3FORMS AJAX
        ══════════════════════════════════════ */
        document.getElementById('contactFormAjax').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('contactSubmitBtn');
            const originalText = btn.innerText;

            btn.innerHTML = '<span class="spinner"></span>Sending...';
            btn.disabled = true;
            showToast('Sending your message...', 'sending', 5000);

            const payload = {
                access_key: "e69c9130-e2dc-48da-b07f-cbd363207a51",
                subject: "New Contact Message",
                from_name: "Drago Cart Contact",
                name: document.getElementById('contactName').value,
                email: document.getElementById('contactEmail').value,
                phone: document.getElementById('contactPhone').value,
                message: document.getElementById('contactMessage').value,
                botcheck: false
            };

            try {
                const res = await fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    showToast('Message sent successfully! We will get back to you.', 'success', 5000);
                    document.getElementById('contactFormAjax').reset();
                } else {
                    throw new Error(data.message || 'Error sending message');
                }
            } catch (err) {
                console.error("Contact form error:", err);
                showToast("Failed to send message: " + err.message, "error", 8000);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
