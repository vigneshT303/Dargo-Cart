<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    z-index: 3;
}

h1{
            margin-bottom:20px;
            color:rgb(164, 10, 191);
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
        }
        
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background: url(./assets/project.jpg)
     no-repeat center center fixed;
    background-size: cover;
}

.login-box{
    width:320px;
    padding:25px;
    background:pink; 
    border-radius:12px;
    box-shadow:0 8px 20px black;
    text-align:center;
    transform: perspective(1000px) translateZ(0);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.login-box:hover{
    transform: perspective(1000px) translateZ(15px);
    box-shadow:0 15px 30px black;
}

.login-box h1{
    margin-bottom:20px;
    color:purple;
    text-shadow:1px 1px 2px black;
}

.input-box{
    margin:15px 0;
    text-align:left;
}

.input-box label{
    display:block;
    font-size:14px;
    margin-bottom:5px;
    color:rgb(43, 41, 41);
}

.input-box input{
    width:100%;
    padding:10px;
    border:1px solid whitesmoke;
    border-radius:6px;
    box-shadow: inset 2px 2px 5px black;
    transition: transform 0.2s ease;
}

.input-box input:focus{
    transform: scale(1.05);
    border-color:purple;
}

button{
    width:100%;
    padding:12px;
    background:purple;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    box-shadow:0 5px 0 rgb(63, 1, 63);
    transition: all 0.2s ease;
}

button:hover{
    background:#a020f0;
    transform: translateY(-3px);
    box-shadow:0 8px 0 rgb(29, 2, 29);
}

button:active{
    transform: translateY(2px);
    box-shadow:0 3px 0 purple;
}
#msg{
            margin-right:15px;
        }
</style>
</head>

<body>
<div class="login-box">
 <h1>Login Form</h1>
    <form id="myform">
        <div class="input-box">
            <label for="name">Username:</label>
            <input type="text" placeholder="Enter name" id="name" required>
        </div>
        <div class="input-box">
            <label for="pwd">Password:</label>
            <input type="password" placeholder="Enter password" id="pwd" required>
        </div>
        <button type="submit">Login</button>
    </form>
    <h2 id="msg"></h2>
</div>
</body>
<script>
    let regform=document.getElementById("myform")

    regform.onsubmit=function(e){
        e.preventDefault()
       let name=document.getElementById("name").value
        let password=document.getElementById("pwd").value
        let storedata=JSON.parse(localStorage.getItem("user"))

        if((name==storedata.name)&&(password==storedata.pwd)){
             document.getElementById("msg").innerText="Login Success"
         document.getElementById("msg").style.color="green"
         setTimeout(() => {
            window.location.href="product.html"
         }, 1500);
        }else{
             document.getElementById("msg").innerText="INVALID USER"
         document.getElementById("msg").style.color="red"
        }
    }
</script>
</html>
